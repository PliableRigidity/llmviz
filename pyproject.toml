[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmvis"
version = "0.1.0"
description = "Live visualizer and educational debugger for local LLM inference"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "textual>=0.79.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
nvidia = [
    "nvidia-ml-py>=12.0.0",
    "pynvml>=11.0",
]
mlx = [
    "mlx>=0.18; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.18; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]

[project.scripts]
llmvis = "llmvis.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/llmvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src"]
